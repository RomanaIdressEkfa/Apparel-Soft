---
# Runs on cPanel when you press "Deploy HEAD Commit" in Git Version Control.
#
# The repository itself is the application: clone it to the folder that sits one
# level above the subdomain's document root, e.g. document root
# "apparel/public" means the repository path is "/home/<user>/apparel".
# Nothing is copied here — these tasks only refresh dependencies, schema and
# caches, so they work whatever the folder is called.
deployment:
  tasks:
    - export PHP=$(command -v /opt/cpanel/ea-php83/root/usr/bin/php || command -v php)
    - $PHP -v
    - if [ -f composer.phar ]; then $PHP composer.phar install --no-dev --optimize-autoloader --no-interaction; else composer install --no-dev --optimize-autoloader --no-interaction; fi
    - $PHP artisan migrate --force
    - $PHP artisan storage:link || true
    - $PHP artisan config:cache
    - $PHP artisan route:cache
    - $PHP artisan view:cache
    - chmod -R 775 storage bootstrap/cache
