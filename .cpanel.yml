---
# Runs on cPanel when you press "Deploy HEAD Commit" in Git Version Control.
# The repository itself lives at /home/<user>/apparel-soft and the subdomain's
# document root points at /home/<user>/apparel-soft/public, so nothing needs
# copying — we only refresh dependencies, schema and caches.
deployment:
  tasks:
    - export APPDIR=/home/endobmuc/apparel-soft
    - cd $APPDIR
    - /opt/cpanel/ea-php83/root/usr/bin/php composer.phar install --no-dev --optimize-autoloader --no-interaction || composer install --no-dev --optimize-autoloader --no-interaction
    - /opt/cpanel/ea-php83/root/usr/bin/php artisan migrate --force
    - /opt/cpanel/ea-php83/root/usr/bin/php artisan config:cache
    - /opt/cpanel/ea-php83/root/usr/bin/php artisan route:cache
    - /opt/cpanel/ea-php83/root/usr/bin/php artisan view:cache
    - /bin/chmod -R 775 $APPDIR/storage $APPDIR/bootstrap/cache
